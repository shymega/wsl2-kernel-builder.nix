      - name: Upload assets to versioned release
        if: |
          github.event_name == 'schedule' && 
          needs.check-new-releases.outputs.has-new-release == 'true' &&
          needs.test-compatibility.outputs.latest-status == 'success'
        run: |
          echo "Uploading assets to versioned release..."
          
          latest_kernel="${{ needs.test-compatibility.outputs.latest-kernel }}"
          latest_zfs="${{ needs.test-compatibility.outputs.latest-zfs }}"
          tag="v${latest_kernel}-zfs${latest_zfs}"
          
          # Check if release exists and get ID
          if gh api repos/${{ github.repository }}/releases/tags/$tag >/dev/null 2>&1; then
            release_id=$(gh api repos/${{ github.repository }}/releases/tags/$tag --jq '.id')
            
            # Upload latest artifacts only (since this is for the new kernel)
            if [ -d "latest-artifacts" ]; then
              for file in latest-artifacts/*; do
                if [ -f "$file" ]; then
                  filename=$(basename "$file")
                  # Rename to remove 'latest-' prefix for versioned release
                  clean_name=$(echo "$filename" | sed 's/^latest-//')
                  echo "Uploading $filename as $clean_name..."
                  
                  gh api repos/${{ github.repository }}/releases/$release_id/assets \
                    --method POST \
                    --field name="$clean_name" \
                    --input "$file" \
                    --header "Content-Type: application/octet-stream"
                fi
              done
            fi
          else
            echo "Versioned release $tag not found, skipping asset upload"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}